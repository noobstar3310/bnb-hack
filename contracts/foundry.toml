[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc = "0.8.30"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = false
bytecode_hash = "none"
verbosity = 2

remappings = [
  "forge-std/=lib/forge-std/src/",
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
]

[profile.default.fuzz]
runs = 512

# PRD SC-07 calls for invariant tests over the share accounting.
[profile.default.invariant]
runs = 256
depth = 32
fail_on_revert = false

# Heavier settings for pre-deployment runs: FOUNDRY_PROFILE=deep forge test
[profile.deep.fuzz]
runs = 10000

[profile.deep.invariant]
runs = 1024
depth = 128

[fmt]
line_length = 110
tab_width = 4
bracket_spacing = false
int_types = "long"

[lint]
exclude_lints = ["screaming-snake-case-immutable"]

[rpc_endpoints]
bsc = "${BSC_RPC_URL}"
bsc_testnet = "${BSC_TESTNET_RPC_URL}"

[etherscan]
bsc = {key = "${ETHERSCAN_API_KEY}", chain = 56}
bsc_testnet = {key = "${ETHERSCAN_API_KEY}", chain = 97}
